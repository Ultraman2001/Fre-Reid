MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/workspace/pretrained/mambavision_tiny_1k.pth.tar'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'mambavision_tiny_TransReID'
  STRIDE_SIZE: [12, 12]
  DROP_PATH: 0.3
  DROP_OUT: 0.0
  ATT_DROP_RATE: 0.0
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  POOLING_TYPE: 'gem'
  SIE_CAMERA: False
  SIE_XISHU: 1.5
  EMA:
    ENABLED: False
    DECAY: 0.998
  MAMBAVISION:
    SASF_STAGES: []
    GLOBAL_STAGES: [2, 3]
    USE_SFM: False
    USE_FINE_BRANCH: False
  OSNET_FUSION:
    ENABLED: True
    OSNET_TYPE: 'osnet_x1_0'
    PRETRAIN_PATH: ''
    FREEZE_OSNET: False
    OSNET_LOSS_WEIGHT: 0.5
    FUSED_LOSS_WEIGHT: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  PAM:
    ENABLED: False
  OSBBM:
    ENABLED: False

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: '/workspace/data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 80
  BASE_LR: 0.00035
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 10
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 20
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_BIAS: 0.05
  BIAS_LR_FACTOR: 1
  SEED: 42
  MARGIN: 0.3
  STAGE4_LR_FACTOR: 2.0
  SASF_LR_FACTOR: 1.5
  OSNET_LR_FACTOR: 1.0
  OSNET_FUSION_LR_FACTOR: 2.0
  CLIP_GRAD_NORM: 5.0
  RATR_ENABLED: False

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  FEAT_CONCAT: False
  FEAT_MODE: 'concat'
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/Market/tiny/mambavision_tiny_osnet_concat_fast-b64k4'
