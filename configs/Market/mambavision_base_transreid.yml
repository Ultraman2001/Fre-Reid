MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/workspace/pretrained/mambavision_base_1k.pth.tar'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'  # ✓ 与Tiny最佳配置对齐
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True  # ✓ 与Tiny最佳配置对齐（soft triplet）
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'mambavision_base_TransReID'
  STRIDE_SIZE: [12, 12]  # ✓ 总stride=12，特征图21x11（最密集，最佳性能！）
 
  DROP_PATH: 0.5  # Base模型使用0.3
  DROP_OUT: 0.0
  ATT_DROP_RATE: 0.0
 
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: '/workspace/data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 160
  BASE_LR: 0.00035  # ✓ Base模型提高学习率（加快收敛）
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 20  # ✓ Base模型warmup（平衡快速收敛与稳定性）
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 40
  LOG_PERIOD: 50
  EVAL_PERIOD: 20  # ✓ 更频繁评估（每20轮）
  WEIGHT_DECAY: 0.05  # ✓ 与Tiny最佳配置对齐
  WEIGHT_DECAY_BIAS: 0.05
  BIAS_LR_FACTOR: 1
  SEED: 42
  MARGIN: 0.3

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/Market/base/market1501_mambavision_base_global'



