MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/workspace/pretrained/mambavision_tiny_1k.pth.tar'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'mambavision_tiny_TransReID'
  STRIDE_SIZE: [12, 12]
  DROP_PATH: 0.5
  DROP_OUT: 0.0
  ATT_DROP_RATE: 0.0
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  POOLING_TYPE: 'gem'
  SIE_CAMERA: False
  SIE_XISHU: 1.5
  EMA:
    ENABLED: False
    DECAY: 0.998
  MAMBAVISION:
    SASF_STAGES: []
    GLOBAL_STAGES: [2, 3]
    USE_SFM: False
    SFM_DEPTHS: [1, 2, 3]
    SFM_DROP_PATH: 0.45
    USE_FINE_BRANCH: False
  OSNET_FUSION:
    ENABLED: True
    OSNET_TYPE: 'osnet_x1_0'
    PRETRAIN_PATH: '/workspace/pretrained/osnet_x1_0_imagenet.pth'
    FREEZE_OSNET: False
    OSNET_LOSS_WEIGHT: 0.5
    FUSED_LOSS_WEIGHT: 1.0
    FUSION_TYPE: 'fdmf'
    FUSION_NORM: 'none'
    FUSION_BETA: 1.0
    FCU_ENABLED: True
    FCU_INIT_SCALE: 0.1
    FCU_STAGES: [2, 3]
    FCU_DIRECTION: 'bidirectional'
    FCU_STAGE2_DIRECTION: 'osnet_to_mamba'
    FCU_STAGE3_DIRECTION: 'mamba_to_osnet'
    FDMF_FUSED_FORM: 'mamba_fdmf'
    FDMF_MAMBA_DEPTH: 1
    FDMF_MAMBA_D_STATE: 8
    FDMF_MAMBA_D_CONV: 3
    FDMF_MAMBA_INIT_SCALE: 0.1
    FDMF_MAMBA_BIDIRECTIONAL: True
    FDMF_MLP_RATIO: 2.0
    FDMF_MSEF_ENABLED: True
    FDMF_MSEF_REDUCTION_RATIO: 16
    FDMF_MSEF_RES_SCALE_ENABLED: False
    FDMF_MSEF_RES_SCALE_INIT: 0.1
    FDMF_DESCRIPTOR_MAMBA_WEIGHT: 1.0
    FDMF_DESCRIPTOR_FDMF_WEIGHT: 0.75
    FDMF_DESCRIPTOR_OSNET_WEIGHT: 0.4
    STAGE3_STRIPE_LOCAL_ENABLED: True
    STAGE3_LOCAL_TYPE: 'semantic_detail'
    STAGE3_STRIPE_LOCAL_NUM_STRIPES: 2
    STAGE3_STRIPE_LOCAL_LOSS_WEIGHT: 0.1
    STAGE3_STRIPE_LOCAL_MAMBA_DEPTH: 0
    STAGE3_STRIPE_LOCAL_PART_DIM: 0
    STAGE3_STRIPE_LOCAL_INFER_WEIGHT: 0.1
    STAGE3_SOFT_TEMPERATURE: 1.5
    STAGE3_SOFT_PRIOR_SCALE: 1.0
    STAGE3_SOFT_BALANCE_WEIGHT: 0.01
    STAGE3_SOFT_ORDER_WEIGHT: 0.01
    STAGE3_DETAIL_MASK_STAGE: 'stage3'
    STAGE3_DETAIL_FOREGROUND_GATE: True
    STAGE3_DETAIL_FOREGROUND_STAGE: 'stage3'
    STAGE3_DETAIL_SOURCE: 'conv4'
    STAGE3_DETAIL_RESIDUAL_INJECTION: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  PAM:
    ENABLED: False
  OSBBM:
    ENABLED: False

DATASETS:
  NAMES: ('msmt17')
  ROOT_DIR: '/workspace/data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  STEPS: (40, 70, 90, 120)
  MAX_EPOCHS: 160
  BASE_LR: 0.00035
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 20
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 40
  LOG_PERIOD: 50
  EVAL_PERIOD: 20
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_BIAS: 0.05
  BIAS_LR_FACTOR: 1
  SEED: 42
  MARGIN: 0.3
  STAGE4_LR_FACTOR: 2.0
  SASF_LR_FACTOR: 1.0
  OSNET_LR_FACTOR: 2.0
  OSNET_WEIGHT_DECAY: 0.0005
  OSNET_WEIGHT_DECAY_BIAS: 0.0005
  OSNET_FUSION_LR_FACTOR: 3.0
  CLIP_GRAD_NORM: 10.0
  RATR_ENABLED: False

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  FEAT_CONCAT: False
  FEAT_MODE: 'weighted_mamba_fdmf_osnet_stage3local'
  EVAL_ALL_FEATS: False
  BRANCH_NORM_BETAS: [0.25, 0.5, 0.63, 0.75]
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/MSMT17/fdmf_semantic_detail_no_osbbm_s42'
